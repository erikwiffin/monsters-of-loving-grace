<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monsters of Loving Grace</title>
  <meta name="description" content="Hot-seat browser prototype of the Monsters of Loving Grace board game.">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/logo.png" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- #sketch roughens box strokes so they look hand-drawn (used by styles.css) -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
    <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <div id="app"><noscript>This prototype requires JavaScript.</noscript></div>


  <!-- index.html?print opens the print-and-play view (spec 032) instead of the game. -->
  <script type="module">
    if (new URLSearchParams(location.search).has('print')) import('./src/ui/print.js');
    else import('./src/ui/app.js');
  </script>
</body>
</html>
